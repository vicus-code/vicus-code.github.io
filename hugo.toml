# Bárdits Éva – weboldal beállításai
# Ezt a fájlt ritkán kell módosítani. A tartalom a content/ és data/ mappákban van.
# Két nyelv: magyar (alapértelmezett, a gyökérben) és angol (/en/).
# Minden tartalomfájl mindkét nyelven megjelenik; az angol szövegek a *_en mezőkben vannak.

# Közzétételkor a GitHub a tényleges címet adja meg (lásd .github/workflows/hugo.yaml),
# ez a sor a saját gépen való építéshez kell.
baseURL = 'https://barditseva.hu/'
defaultContentLanguage = 'hu'
timeZone = 'Europe/Budapest'
enableRobotsTXT = true
# A jövőbeli dátumú tételek (pl. bejelentett előadás) is megjelennek
buildFuture = true
disableKinds = ['taxonomy', 'term', 'rss']

# Címek: a mappanevek (vizualis, kutatas, rolam, linkek) maradnak, a látható cím a menühöz igazodik.
# Az angol címek lent, a [languages.en.permalinks] részben.
[permalinks]
  [permalinks.section]
    vizualis = '/kep/'
    kutatas = '/szoveg/'
    rolam = '/cv/'
    linkek = '/linkek/'
  [permalinks.page]
    vizualis = '/kep/:contentbasename/'
    kutatas = '/szoveg/:contentbasename/'

# A koncertek a Zene oldalon jelennek meg (lista: data/koncertek.yaml, fotók: content/koncertek/_index.md).
# A content/koncertek/ mappának ezért nincs saját oldala; a régi /esemeny/ cím a Zene oldalra visz
# (a content/zene/_index.md „aliases” mezője).
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'never'
  [cascade.target]
    path = '{/koncertek,/koncertek/**}'

[params]
  author = 'Bárdits Éva'
  # Megosztási kép (ha egy oldalnak nincs saját képe)
  shareImage = 'images/rolam/portre-inertia.jpg'
  # A színek és a betűk az assets/css/main.css elején vannak; az oldalak rajzai a layouts/_partials/*-disz.html fájlokban.

[languages]
  [languages.hu]
    weight = 1
    locale = 'hu-HU'
    title = 'Bárdits Éva'
    [languages.hu.params]
      description = 'Bárdits Éva budapesti művész, kulturális munkás weboldala: zene, koncert, kép, szöveg.'
    [[languages.hu.menus.main]]
      name = 'Zene'
      pageRef = '/zene'
      weight = 10
    [[languages.hu.menus.main]]
      name = 'Kép'
      pageRef = '/vizualis'
      weight = 30
    [[languages.hu.menus.main]]
      name = 'Szöveg'
      pageRef = '/kutatas'
      weight = 40
    [[languages.hu.menus.main]]
      name = 'CV'
      pageRef = '/rolam'
      weight = 5
    [[languages.hu.menus.main]]
      name = 'Linkek'
      pageRef = '/linkek'
      weight = 50
  [languages.en]
    weight = 2
    locale = 'en-GB'
    title = 'Éva Bárdits'
    [languages.en.params]
      description = 'Website of Éva Bárdits, Budapest-based artist and cultural worker: music, concerts, artwork, texts.'
    [[languages.en.menus.main]]
      name = 'Music'
      pageRef = '/zene'
      weight = 10
    [[languages.en.menus.main]]
      name = 'Artwork'
      pageRef = '/vizualis'
      weight = 30
    [[languages.en.menus.main]]
      name = 'Text'
      pageRef = '/kutatas'
      weight = 40
    [[languages.en.menus.main]]
      name = 'CV'
      pageRef = '/rolam'
      weight = 5
    [[languages.en.menus.main]]
      name = 'Links'
      pageRef = '/linkek'
      weight = 50

    [languages.en.permalinks]
      [languages.en.permalinks.section]
        zene = '/music/'
        vizualis = '/image/'
        kutatas = '/text/'
        rolam = '/cv/'
        linkek = '/links/'
      [languages.en.permalinks.page]
        zene = '/music/:contentbasename/'
        vizualis = '/image/:contentbasename/'
        kutatas = '/text/:contentbasename/'
# Ugyanaz a content/ mappa mindkét nyelvhez
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
    [module.mounts.sites.matrix]
      languages = ['**']

[markup.goldmark.renderer]
  # A böngészős szerkesztő (Pages CMS) HTML-t is írhat a szövegbe – ezt engedjük.
  unsafe = true

[markup.goldmark.extensions.typographer]
  # Magyar idézőjelek: „…”
  leftDoubleQuote = '&bdquo;'
  rightDoubleQuote = '&rdquo;'

[imaging]
  resampleFilter = 'Lanczos'
  [imaging.jpeg]
    quality = 80
  [imaging.webp]
    quality = 78

[caches.images]
  dir = ':cacheDir/images'

[sitemap]
  changeFreq = 'monthly'
