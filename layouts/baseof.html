<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }} section-{{ .Section | default "home" }}">
  <a class="skip" href="#tartalom">{{ T "skip" }}</a>
  {{ partial "header.html" . }}
  <main id="tartalom">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "check.html" . }}
  {{- with resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{- end }}
</body>
</html>
