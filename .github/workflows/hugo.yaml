# A weboldal építése és közzététele a GitHub Pagesen.
# Minden mentés (push a main ágra) után lefut, és naponta egyszer magától is,
# hogy a lejárt koncertek átkerüljenek a „Korábban” listába.
name: Weboldal építése és közzététele

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.169.0
  TZ: Europe/Budapest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: GitHub Pages beállítása
        id: pages
        uses: actions/configure-pages@v6
      - name: Hugo telepítése
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sSfL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf hugo.tar.gz
          rm hugo.tar.gz
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Képgyorsítótár visszatöltése
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-
      - name: Weboldal építése
        run: |
          hugo version
          hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --cacheDir "${{ runner.temp }}/.cache/hugo"
      - name: Képgyorsítótár mentése
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
      - name: Kész oldal feltöltése
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Közzététel
        id: deployment
        uses: actions/deploy-pages@v5
